name: QueroQuitar
description: QueroQuitar is a Brazilian fintech platform that helps consumers and businesses
  renegotiate and settle overdue debts online. Through its web and mobile apps it connects
  users with 50+ creditors (including Santander, Claro, Sky, BV, Inter and Carrefour)
  to arrange discounted, installment-based payoffs, and participates in Brazil's Desenrola
  Brasil program. It also offers QueroCredito credit products and QueroSaude health services.
  It is a portfolio company of 500 Global. As of this enrichment pass QueroQuitar exposes
  no public developer API, SDK, or documentation surface.
